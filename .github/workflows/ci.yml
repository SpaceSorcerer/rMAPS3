name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS assets
        run: |
          git lfs version
          git lfs install
          git lfs ls-files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q cli.py rmaps_core legacy webui tests

      - name: CLI smoke tests
        run: python tests/smoke_cli.py

      - name: Path handling tests
        run: python tests/test_path_handling.py

      - name: CLIP tests (SE + A5SS)
        run: python tests/test_clip.py --event se a5ss

      - name: CLIP method comparison (SE)
        run: python tests/test_clip.py --event se --compare-methods

      - name: Check motif FASTA availability
        id: motif_fasta
        run: |
          if [ -f "genomedata/hg19/hg19.fa" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Motif test (SE)
        if: steps.motif_fasta.outputs.available == 'true'
        run: python tests/test_motif.py --event se --fasta-root genomedata --genome hg19

      - name: Motif method comparison (SE)
        if: steps.motif_fasta.outputs.available == 'true'
        run: python tests/test_motif.py --event se --fasta-root genomedata --genome hg19 --compare-methods

      - name: Motif test skipped
        if: steps.motif_fasta.outputs.available != 'true'
        run: |
          echo "Skipping motif CI test: genomedata/hg19/hg19.fa not found."

  lab-fork:
    # Lab layer of branch lab/miat-qki: pinned environment, tools/ compile check and the pytest suite.
    # tests/legacy and the hg19 motif script (tests/test_motif.py) need data not in the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tests/test_artifact_inventory.py and test_full_mode_controls.py check out the released engine
          # commit (RELEASED_ENGINE_COMMIT) from a shared clone of this repository; a shallow clone lacks it.
          fetch-depth: 0

      - name: Arial for the figure layout audit
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -q
          sudo apt-get install -y -q ttf-mscorefonts-installer fontconfig
          fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Compile tools
        run: python -m compileall -q tools

      - name: Test suite
        env:
          RMAPS_FORCE_MOTIF_FALLBACK: "1"
          # The released-engine clone needs no LFS test data and this checkout has none to smudge from.
          GIT_LFS_SKIP_SMUDGE: "1"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m pytest -q tests --ignore=tests/legacy --ignore=tests/test_motif.py
